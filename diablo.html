<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Diablo: Sanctuary of the Mildly Inconvenienced</title>
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --panel-bg: #141110;
      --border-gold: #8a733e;
      --text-gold: #d4af37;
      --text-red: #ff3333;
      --text-blue: #3399ff;
    }

    * { box-sizing: border-box; user-select: none; }

    body {
      background-color: var(--bg-dark);
      color: #ccc;
      font-family: 'Georgia', serif;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: var(--text-red);
      font-size: 24px;
      margin: 5px 0;
      text-shadow: 2px 2px 4px #000;
      letter-spacing: 2px;
    }

    #game-container {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    canvas {
      background: #000;
      border: 3px solid var(--border-gold);
      box-shadow: 0 0 15px rgba(0,0,0,0.9);
      cursor: crosshair;
    }

    .sidebar {
      width: 280px;
      height: 512px;
      background: var(--panel-bg);
      border: 3px solid var(--border-gold);
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: inset 0 0 10px #000;
      font-size: 13px;
    }

    .panel-header {
      color: var(--text-gold);
      border-bottom: 1px solid var(--border-gold);
      padding-bottom: 4px;
      margin-bottom: 8px;
      font-weight: bold;
      text-align: center;
      text-transform: uppercase;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      margin: 4px 0;
    }

    .btn-stat {
      background: #333;
      color: var(--text-gold);
      border: 1px solid var(--border-gold);
      width: 20px;
      height: 20px;
      cursor: pointer;
      font-weight: bold;
      line-height: 15px;
    }

    .btn-stat:hover { background: #555; }

    #log-box {
      height: 120px;
      background: #000;
      border: 1px solid #333;
      padding: 5px;
      overflow-y: auto;
      font-size: 11px;
      color: #aaa;
      font-family: monospace;
    }

    .log-entry { margin-bottom: 4px; }
    .log-gold { color: var(--text-gold); }
    .log-danger { color: var(--text-red); }
    .log-magic { color: var(--text-blue); }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      background: #000;
      padding: 4px;
      border: 1px solid #333;
      min-height: 100px;
    }

    .inv-slot {
      width: 100%;
      height: 40px;
      background: #1a1a1a;
      border: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      text-align: center;
      cursor: pointer;
    }

    .inv-slot:hover { border-color: var(--text-gold); }

    .btn-back {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #8b0000;
      color: white;
      border: 1px solid var(--border-gold);
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
    }

    .btn-back:hover { background-color: #b22222; }
  </style>
</head>
<body>

  <h1>SANCTUARY OF THE MILDLY INCONVENIENCED</h1>

  <div id="game-container">
    <canvas id="gameCanvas" width="512" height="512"></canvas>

    <div class="sidebar">
      <div>
        <div class="panel-header">Hero Status</div>
        <div class="stat-row"><span>Class:</span><span id="lbl-class">Necromancer</span></div>
        <div class="stat-row"><span>Level:</span><span id="lbl-level">1</span></div>
        <div class="stat-row"><span>EXP:</span><span id="lbl-exp">0 / 100</span></div>
        <div class="stat-row"><span>Unspent Points:</span><span id="lbl-points" style="color:var(--text-gold)">0</span></div>
        <hr style="border-color:#333;">
        <div class="stat-row">
          <span>Strength: <b id="val-str">10</b></span>
          <button class="btn-stat" onclick="addStat('str')">+</button>
        </div>
        <div class="stat-row">
          <span>Dexterity: <b id="val-dex">10</b></span>
          <button class="btn-stat" onclick="addStat('dex')">+</button>
        </div>
        <div class="stat-row">
          <span>Vitality: <b id="val-vit">10</b></span>
          <button class="btn-stat" onclick="addStat('vit')">+</button>
        </div>
      </div>

      <div>
        <div class="panel-header">Equipment & Satchel</div>
        <div class="inventory-grid" id="inventory-container">
          <!-- Inventory Slots Generated by JS -->
        </div>
      </div>

      <div>
        <div class="panel-header">Quest Log</div>
        <div id="log-box">
          <div class="log-entry log-magic">Welcome to the Cathedral of Petty Doom.</div>
          <div class="log-entry">Quest: Descend to Floor 5 and defeat Diablo's Intern, Greg.</div>
        </div>
      </div>
    </div>
  </div>

  <a href="index2.html" class="btn-back">Flee to Main Page</a>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const TILE_SIZE = 32;
    const GRID_SIZE = 16;

    // Game Variables
    let currentFloor = 1;
    const maxFloors = 5;

    let player = {
      x: 1, y: 1,
      hp: 50, maxHp: 50,
      mana: 30, maxMana: 30,
      level: 1, exp: 0, nextExp: 100,
      unspent: 0,
      str: 10, dex: 10, vit: 10,
      gold: 25,
      inventory: ["Health Potion", "Rusty Butter Knife"]
    };

    let map = [];
    let enemies = [];
    let items = [];

    // Dark Humor Quest dialogue lines
    const flavorTexts = [
      "You stepped on a skeleton's toe. It looks offended.",
      "You found a potion labeled 'Definitely Not Poison'.",
      "A fallen cultist dropped a coupon for 10% off blood sacrifices.",
      "The walls smell faintly of burnt toast and ancient regret.",
      "You hear demonic whispering... it's arguing about spreadsheets."
    ];

    function logMessage(msg, type = "") {
      const box = document.getElementById("log-box");
      const div = document.createElement("div");
      div.className = "log-entry " + type;
      div.innerText = msg;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function generateFloor() {
      map = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(1));

      // Simple Dungeon Generation (Drunkard's Walk)
      let cx = 1, cy = 1;
      map[cy][cx] = 0;
      let floorTiles = 0;

      while (floorTiles < 120) {
        let dir = Math.floor(Math.random() * 4);
        if (dir === 0 && cy > 1) cy--;
        if (dir === 1 && cy < GRID_SIZE - 2) cy++;
        if (dir === 2 && cx > 1) cx--;
        if (dir === 3 && cx < GRID_SIZE - 2) cx++;

        if (map[cy][cx] === 1) {
          map[cy][cx] = 0;
          floorTiles++;
        }
      }

      // Stairs down
      map[cy][cx] = 3;

      // Spawn Enemies
      enemies = [];
      let enemyCount = 3 + currentFloor * 2;
      for (let i = 0; i < enemyCount; i++) {
        let ex, ey;
        do {
          ex = Math.floor(Math.random() * GRID_SIZE);
          ey = Math.floor(Math.random() * GRID_SIZE);
        } while (map[ey][ex] !== 0 || (ex === player.x && ey === player.y));

        let isBoss = (currentFloor === maxFloors && i === 0);
        enemies.push({
          x: ex, y: ey,
          name: isBoss ? "Greg, Intern of Terror" : (Math.random() > 0.5 ? "Anxious Cultist" : "Overworked Skeleton"),
          hp: isBoss ? 150 : 15 + currentFloor * 10,
          maxHp: isBoss ? 150 : 15 + currentFloor * 10,
          atk: isBoss ? 12 : 3 + currentFloor * 2,
          isBoss: isBoss
        });
      }

      logMessage(`Entered Dungeon Floor ${currentFloor}.`, "log-magic");
      if (Math.random() > 0.3) {
        logMessage(flavorTexts[Math.floor(Math.random() * flavorTexts.length)]);
      }
    }

    function addStat(type) {
      if (player.unspent > 0) {
        player.unspent--;
        if (type === 'str') player.str++;
        if (type === 'dex') player.dex++;
        if (type === 'vit') {
          player.vit++;
          player.maxHp += 10;
          player.hp += 10;
        }
        updateUI();
      }
    }

    function updateUI() {
      document.getElementById("lbl-level").innerText = player.level;
      document.getElementById("lbl-exp").innerText = `${player.exp} / ${player.nextExp}`;
      document.getElementById("lbl-points").innerText = player.unspent;
      document.getElementById("val-str").innerText = player.str;
      document.getElementById("val-dex").innerText = player.dex;
      document.getElementById("val-vit").innerText = player.vit;

      const invContainer = document.getElementById("inventory-container");
      invContainer.innerHTML = "";
      for (let i = 0; i < 8; i++) {
        const slot = document.createElement("div");
        slot.className = "inv-slot";
        slot.innerText = player.inventory[i] || "[Empty]";
        if (player.inventory[i] === "Health Potion") {
          slot.onclick = () => usePotion(i);
        }
        invContainer.appendChild(slot);
      }
    }

    function usePotion(index) {
      player.hp = Math.min(player.maxHp, player.hp + 30);
      player.inventory.splice(index, 1);
      logMessage("Drank Health Potion. Tastes like warm grape soda.", "log-magic");
      updateUI();
    }

    function movePlayer(dx, dy) {
      let nx = player.x + dx;
      let ny = player.y + dy;

      if (nx < 0 || nx >= GRID_SIZE || ny < 0 || ny >= GRID_SIZE) return;
      if (map[ny][nx] === 1) return; // Wall

      // Check Enemy Combat
      let targetEnemy = enemies.find(e => e.x === nx && e.y === ny);
      if (targetEnemy) {
        // Attack Enemy
        let dmg = Math.floor(player.str * 0.8 + Math.random() * player.dex);
        targetEnemy.hp -= dmg;
        logMessage(`You struck ${targetEnemy.name} for ${dmg} dmg!`);

        if (targetEnemy.hp <= 0) {
          logMessage(`Defeated ${targetEnemy.name}!`, "log-gold");
          player.exp += 25;
          if (player.exp >= player.nextExp) {
            player.level++;
            player.exp -= player.nextExp;
            player.nextExp = Math.floor(player.nextExp * 1.5);
            player.unspent += 3;
            logMessage("LEVEL UP! You feel mildly superior.", "log-gold");
          }
          if (targetEnemy.isBoss) {
            alert("VICTORY! You defeated Greg, Intern of Terror, and reclaimed the Cathedral breakroom!");
          }
          enemies = enemies.filter(e => e !== targetEnemy);
        }
      } else {
        player.x = nx;
        player.y = ny;

        // Check Stairs
        if (map[ny][nx] === 3) {
          if (currentFloor < maxFloors) {
            currentFloor++;
            generateFloor();
            player.x = 1; player.y = 1;
          }
        }
      }

      // Enemies Turn
      enemies.forEach(e => {
        let dist = Math.abs(e.x - player.x) + Math.abs(e.y - player.y);
        if (dist === 1) {
          let edmg = Math.max(1, e.atk - Math.floor(player.vit * 0.3));
          player.hp -= edmg;
          logMessage(`${e.name} hit you for ${edmg} dmg!`, "log-danger");
          if (player.hp <= 0) {
            alert("YOU DIED. Your body will serve as a mildly uncomfortable floor mat.");
            location.reload();
          }
        }
      });

      updateUI();
    }

    window.addEventListener("keydown", e => {
      if (e.key === "ArrowUp" || e.key === "w") movePlayer(0, -1);
      if (e.key === "ArrowDown" || e.key === "s") movePlayer(0, 1);
      if (e.key === "ArrowLeft" || e.key === "a") movePlayer(-1, 0);
      if (e.key === "ArrowRight" || e.key === "d") movePlayer(1, 0);
    });

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render Isometric-Style Grid
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          let tile = map[r][c];
          if (tile === 1) {
            ctx.fillStyle = "#1a1614"; ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            ctx.strokeStyle = "#2a221f"; ctx.strokeRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
          } else if (tile === 3) {
            ctx.fillStyle = "#d4af37"; ctx.fillRect(c * TILE_SIZE + 4, r * TILE_SIZE + 4, 24, 24);
          } else {
            ctx.fillStyle = "#332b27"; ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            ctx.strokeStyle = "#221c19"; ctx.strokeRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
          }
        }
      }

      // Draw Enemies
      enemies.forEach(e => {
        ctx.fillStyle = e.isBoss ? "#ff00ff" : "#ff3333";
        ctx.beginPath();
        ctx.arc(e.x * TILE_SIZE + 16, e.y * TILE_SIZE + 16, 12, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw Player
      ctx.fillStyle = "#3399ff";
      ctx.fillRect(player.x * TILE_SIZE + 6, player.y * TILE_SIZE + 6, 20, 20);

      // Health Globe overlay effect
      ctx.fillStyle = "rgba(255, 0, 0, 0.3)";
      ctx.fillRect(10, canvas.height - 20, (player.hp / player.maxHp) * 100, 10);
      ctx.strokeStyle = "#fff";
      ctx.strokeRect(10, canvas.height - 20, 100, 10);

      requestAnimationFrame(render);
    }

    generateFloor();
    updateUI();
    render();
  </script>
</body>
</html>
